; GeekQuest firmware for the GeekMagic SD Pro / SmallTV-style ESP8266 clock.
;
; SAFETY-CRITICAL SETTINGS (do not change without reading README "Recovery"):
;  - flash layout eagle.flash.4m3m.ld matches the stock firmware (1 MB code,
;    3 MB stock files). Changing it can overwrite the stock web files.
;  - flash_size 4MB / flash_mode dio match the stock image header.
;  - tools/check_bin.py fails the build if the .bin is too large for OTA or
;    is missing the update page.

[platformio]
src_dir = firmware
default_envs = test

[env]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
board_build.f_cpu = 160000000L
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.ldscript = eagle.flash.4m3m.ld
monitor_speed = 115200
build_flags =
  -DPIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY_LOW_FLASH
  -DNDEBUG
  -Os
  ; RECOVERY-CHANGE (chunk1): approval switches, all OFF until the user approves (design 12.2)
  ;   A1 flash saving, A2 automatic restarts, A4 strict upload checks
  -DGQ_AUTO_RESTART=0
  -DGQ_STRICT_UPLOAD=0
extra_scripts =
  pre:tools/version.py
  post:tools/pio_post.py

; First hardware test: grass, walking hero, RGB bars, FPS, OTA page.
[env:test]
build_flags = ${env.build_flags} -DGQ_FLASH_SAVE=0 -DGQ_SCENE=GC_SCENE_TEST

; The village game (work in progress).
[env:quest]
build_flags = ${env.build_flags} -DGQ_FLASH_SAVE=0 -DGQ_SCENE=GC_SCENE_VILLAGE

; RECOVERY-CHANGE (chunk1): CI-only build with flash saving compiled in (approval A1 pending).
; It runs every gate but is never published.
[env:quest_save]
build_flags = ${env.build_flags} -DGQ_FLASH_SAVE=1 -DGQ_SCENE=GC_SCENE_VILLAGE
