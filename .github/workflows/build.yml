name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Game core smoke test + browser preview
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate assets and make sure they are committed
        run: |
          pip install pillow
          python tools/png2tiles.py
          git diff --exit-code lib/gamecore/src/assets_gen.h || (echo "assets_gen.h is stale: run python tools/png2tiles.py and commit" && exit 1)
      - name: Smoke test (ASan/UBSan, 1 h simulated per scene)
        run: |
          g++ -std=c++17 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -Wall -Wextra -Werror \
            -o core_smoke test/core_smoke.cpp lib/gamecore/src/gamecore.cpp
          ./core_smoke
      - name: Build browser preview
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq clang lld
          ./tools/build_preview.sh
      - uses: actions/upload-artifact@v4
        with:
          name: GeekQuest-preview
          path: preview/dist/index.html

  firmware:
    name: Firmware (.bin with recovery checks)
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}
      - run: pip install platformio
      - name: Build all environments
        run: pio run -e test -e quest
      - name: Recovery safety check (again, explicitly)
        run: python tools/check_bin.py dist/*.bin
      - name: Size report
        run: ls -l dist/
      - uses: actions/upload-artifact@v4
        with:
          name: GeekQuest-firmware
          path: dist/*.bin
          if-no-files-found: error
